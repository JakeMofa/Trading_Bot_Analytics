name: CD Preprod

on:
  workflow_dispatch:
    inputs:
      source_branch:
        description: Source branch; dispatch this workflow from main
        required: true
        type: choice
        options: [preprod, main]
      version:
        description: Published candidate version (vX.Y.Z or prerelease); binds source and registry digest
        required: true
        type: string
      revision:
        description: Full approved branch HEAD SHA with exact push CI
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: tradebot-preprod
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SOURCE_BRANCH: ${{ inputs.source_branch }}
      RELEASE_VERSION: ${{ inputs.version }}
      APPROVED_REVISION: ${{ inputs.revision }}
      PREPROD_RUN_ID: ''
      GH_TOKEN: ${{ github.token }}
      PIPELINE_REPORT: ci-evidence/preprod-preflight/environment.json
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Require exact CI and qualified preprod runtime/controller
        run: python .github/ci/environment_pipeline.py preflight preprod
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: preprod-preflight-${{ github.run_id }}
          path: ${{ env.PIPELINE_REPORT }}
          if-no-files-found: error
          retention-days: 90

  deploy:
    needs: preflight
    environment: preprod
    # Reuse an approved private operator runner; never expose SSH publicly.
    runs-on: [self-hosted, tradebot-private]
    timeout-minutes: 15
    env:
      SOURCE_BRANCH: ${{ inputs.source_branch }}
      RELEASE_VERSION: ${{ inputs.version }}
      APPROVED_REVISION: ${{ inputs.revision }}
      PREPROD_RUN_ID: ''
      GH_TOKEN: ${{ github.token }}
      PP_DEPLOY_KEY: ${{ secrets.PP_DEPLOY_KEY }}
      PP_DEPLOY_KNOWN_HOSTS: ${{ secrets.PP_DEPLOY_KNOWN_HOSTS }}
      PIPELINE_REPORT: ci-evidence/preprod-deployment/deployment.json
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: One bounded pinned-controller deployment with acceptance checks
        run: python .github/ci/environment_pipeline.py deploy preprod
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: preprod-deployment-evidence-${{ github.run_id }}
          path: ${{ env.PIPELINE_REPORT }}
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: success()
        with:
          name: preprod-acceptance-${{ inputs.revision }}
          path: ${{ env.PIPELINE_REPORT }}
          if-no-files-found: error
          retention-days: 90
