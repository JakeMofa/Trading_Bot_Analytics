name: CD Preprod

on:
  workflow_dispatch:
    inputs:
      source_branch:
        description: Source branch; preprod controls may deploy preprod only
        required: true
        type: choice
        options: [preprod, main]
      version:
        description: Published candidate version (vX.Y.Z or prerelease); binds source and registry digest
        required: true
        type: string
      revision:
        description: Full approved branch HEAD SHA with exact push CI
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: tradebot-preprod
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      SOURCE_BRANCH: ${{ inputs.source_branch }}
      RELEASE_VERSION: ${{ inputs.version }}
      APPROVED_REVISION: ${{ inputs.revision }}
      PREPROD_RUN_ID: ''
      GH_TOKEN: ${{ github.token }}
      PIPELINE_REPORT: ci-evidence/preprod-preflight/environment.json
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Require exact CI and qualified preprod runtime/controller
        run: python .github/ci/environment_pipeline.py preflight preprod
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: preprod-preflight-${{ github.run_id }}
          path: ${{ env.PIPELINE_REPORT }}
          if-no-files-found: error
          retention-days: 90

  deploy:
    needs: preflight
    environment: preprod
    # Reuse an approved private operator runner; never expose SSH publicly.
    runs-on: [self-hosted, tradebot-private]
    timeout-minutes: 15
    env:
      SOURCE_BRANCH: ${{ inputs.source_branch }}
      RELEASE_VERSION: ${{ inputs.version }}
      APPROVED_REVISION: ${{ inputs.revision }}
      PREPROD_RUN_ID: ''
      GH_TOKEN: ${{ github.token }}
      PP_DEPLOY_KEY: ${{ secrets.PP_DEPLOY_KEY }}
      PP_DEPLOY_KNOWN_HOSTS: ${{ secrets.PP_DEPLOY_KNOWN_HOSTS }}
      PIPELINE_REPORT: ci-evidence/preprod-deployment/deployment.json
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate existing operator Python 3.12
        timeout-minutes: 1
        run: |
          /opt/homebrew/bin/python3.12 -I - <<'PY'
          import sys
          if sys.version_info[:2] != (3, 12):
              raise SystemExit('Existing operator Python 3.12 is required')
          print('Operator Python ' + '.'.join(map(str, sys.version_info[:3])))
          PY
      - name: One bounded pinned-controller deployment with acceptance checks
        run: /opt/homebrew/bin/python3.12 .github/ci/environment_pipeline.py deploy preprod
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: preprod-deployment-evidence-${{ github.run_id }}
          path: ${{ env.PIPELINE_REPORT }}
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: success()
        with:
          name: preprod-acceptance-${{ inputs.revision }}
          path: ${{ env.PIPELINE_REPORT }}
          if-no-files-found: error
          retention-days: 90
