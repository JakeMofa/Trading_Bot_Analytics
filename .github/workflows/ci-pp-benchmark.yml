name: CI PP Benchmark

on:
  workflow_run:
    workflows: ["CI — Tradebot checks"]
    types: [completed]
    branches: [preprod]
  workflow_dispatch:
    inputs:
      revision:
        description: Full source SHA at this branch HEAD with passing exact push CI
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: environment-ci-pp-benchmark-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false

jobs:
  qualify:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.event == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    env:
      APPROVED_REVISION: ${{ github.event.workflow_run.head_sha || inputs.revision }}
      GH_TOKEN: ${{ github.token }}
      PIPELINE_REPORT: ci-evidence/pp-benchmark-ci/environment.json
    steps:
      # workflow_run uses the trusted default-branch control code, not PR code.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Reuse exact source CI and check benchmark branch/repository bindings
        run: python .github/ci/environment_pipeline.py ci pp-benchmark
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: pp-benchmark-source-ci-${{ github.run_id }}
          path: ${{ env.PIPELINE_REPORT }}
          if-no-files-found: error
          retention-days: 90
