name: Deploy Tradebot

on:
  workflow_dispatch:
    inputs:
      revision:
        description: Full approved deployment-branch HEAD SHA (must have passing Python tests)
        required: true
        type: string
      operation:
        description: Reviewed phase (production review file required on VM)
        required: true
        type: choice
        default: maintenance
        options: [verify, deploy-verified, maintenance]
  # Validation only. This registers the workflow without changing main.
  push:
    branches: [codex/lightsail-deployment]
    paths: [.github/workflows/deploy-tradebot.yml, 'deploy/lightsail/**']

permissions:
  contents: read
  actions: read

concurrency:
  group: tradebot-production
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate deployment controls
        run: python3 -m unittest discover -s deploy/lightsail -p 'test_*.py' -v

  verify:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/lightsail-deployment' && inputs.operation == 'verify'
    needs: validate
    # A trusted operator runner reaches the existing SSH /32. No public API/firewall changes.
    runs-on: [self-hosted, tradebot-private]
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require approved branch HEAD and exact-revision CI
        env:
          GH_TOKEN: ${{ github.token }}
          APPROVED_REVISION: ${{ inputs.revision }}
        run: python3 deploy/lightsail/verify_ci.py
      - name: Run reviewed bounded complete verification without checkout
        env:
          APPROVED_REVISION: ${{ inputs.revision }}
          RELEASE_OPERATION: verify
          DEPLOY_HOST: ${{ secrets.TRADEBOT_SSH_HOST }}
          DEPLOY_USER: ${{ secrets.TRADEBOT_SSH_USER }}
          DEPLOY_KEY: ${{ secrets.TRADEBOT_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.TRADEBOT_SSH_KNOWN_HOSTS }}
        run: bash deploy/lightsail/dispatch.sh
      - name: Upload sanitized release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tradebot-${{ inputs.operation }}-${{ github.run_id }}
          path: ${{ runner.temp }}/release-evidence.jsonl
          if-no-files-found: warn
          retention-days: 7

  deploy:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/lightsail-deployment' && inputs.operation == 'deploy-verified'
    needs: validate
    # A trusted operator runner reaches the existing SSH /32. No public API/firewall changes.
    runs-on: [self-hosted, tradebot-private]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require approved branch HEAD and exact-revision CI
        env:
          GH_TOKEN: ${{ github.token }}
          APPROVED_REVISION: ${{ inputs.revision }}
        run: python3 deploy/lightsail/verify_ci.py
      - name: Deploy tracked code and run remote smoke checks with rollback
        env:
          APPROVED_REVISION: ${{ inputs.revision }}
          RELEASE_OPERATION: deploy-verified
          DEPLOY_HOST: ${{ secrets.TRADEBOT_SSH_HOST }}
          DEPLOY_USER: ${{ secrets.TRADEBOT_SSH_USER }}
          DEPLOY_KEY: ${{ secrets.TRADEBOT_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.TRADEBOT_SSH_KNOWN_HOSTS }}
        run: bash deploy/lightsail/dispatch.sh
      - name: Upload sanitized release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tradebot-${{ inputs.operation }}-${{ github.run_id }}
          path: ${{ runner.temp }}/release-evidence.jsonl
          if-no-files-found: warn
          retention-days: 7

  maintenance:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/lightsail-deployment' && inputs.operation == 'maintenance'
    needs: validate
    # A trusted operator runner reaches the existing SSH /32. No public API/firewall changes.
    runs-on: [self-hosted, tradebot-private]
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require approved branch HEAD and exact-revision CI
        env:
          GH_TOKEN: ${{ github.token }}
          APPROVED_REVISION: ${{ inputs.revision }}
        run: python3 deploy/lightsail/verify_ci.py
      - name: One authorized quiescent maintenance verification and deployment
        env:
          APPROVED_REVISION: ${{ inputs.revision }}
          RELEASE_OPERATION: maintenance
          DEPLOY_HOST: ${{ secrets.TRADEBOT_SSH_HOST }}
          DEPLOY_USER: ${{ secrets.TRADEBOT_SSH_USER }}
          DEPLOY_KEY: ${{ secrets.TRADEBOT_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.TRADEBOT_SSH_KNOWN_HOSTS }}
        run: bash deploy/lightsail/dispatch.sh
      - name: Upload sanitized release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tradebot-${{ inputs.operation }}-${{ github.run_id }}
          path: ${{ runner.temp }}/release-evidence.jsonl
          if-no-files-found: warn
          retention-days: 7
