name: Python tests

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Compile Python sources
        run: python -m compileall -q backend/app deploy/lightsail
      - name: Install dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Run unit tests
        env:
          ENABLE_OPENAI_ANALYST: "false"
          ENABLE_SUPABASE_SYNC: "false"
          ENABLE_LOCAL_RETENTION: "false"
        run: python -m unittest discover -s backend/tests -v
      - name: Generated A/B retirement descriptor proof (Linux root, no production)
        run: |
          sudo -n env AB_REPORT_PATH="$RUNNER_TEMP/ab-generated-report.json" "$(command -v python)" -m unittest discover -s backend/tests -p test_raw_generations.py -v
          sudo -n chmod 0644 "$RUNNER_TEMP/ab-generated-report.json"
      - uses: actions/upload-artifact@v4
        with:
          name: generated-ab-report-${{ github.sha }}
          path: ${{ runner.temp }}/ab-generated-report.json
          if-no-files-found: error
          retention-days: 7
      - name: Run deployment and maintenance controls
        run: python -m unittest discover -s deploy/lightsail -p 'test_*.py' -v

      - name: Build reviewed Linux timestamp validator artifact
        run: python backend/build_retention_native.py --output "$RUNNER_TEMP/retention-native/_retention_time.so"
      - uses: actions/upload-artifact@v4
        with:
          name: retention-native-${{ github.sha }}
          path: ${{ runner.temp }}/retention-native/
          if-no-files-found: error
          retention-days: 7
