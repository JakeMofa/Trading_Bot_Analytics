name: Python tests

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Compile Python sources
        run: python -m compileall -q backend/app deploy/lightsail
      - name: Install dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Run unit tests
        env:
          ENABLE_OPENAI_ANALYST: "false"
          ENABLE_SUPABASE_SYNC: "false"
          ENABLE_LOCAL_RETENTION: "false"
        run: python -m unittest discover -s backend/tests -v
      - name: Run deployment and maintenance controls
        run: python -m unittest discover -s deploy/lightsail -p 'test_*.py' -v
