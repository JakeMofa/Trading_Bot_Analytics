name: Python tests

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:
  merge_group:

permissions:
  contents: read

# Push runs are retained: production requires exact push-commit CI.
concurrency:
  group: python-tests-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  CI_EVIDENCE_DIR: ${{ github.workspace }}/ci-evidence
  PYTHONDONTWRITEBYTECODE: "1"
  ENABLE_OPENAI_ANALYST: "false"
  ENABLE_SUPABASE_SYNC: "false"
  ENABLE_LOCAL_RETENTION: "false"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      AB_SOURCE_REPOSITORY: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Compile Python sources
        working-directory: ${{ github.workspace }}
        run: python -m compileall -q backend/app deploy/lightsail
      - name: Install dependencies
        working-directory: ${{ github.workspace }}
        run: python -m pip install -r backend/requirements.txt
      - name: Export exact tracked candidate (no checkout/worktree/local data)
        working-directory: ${{ github.workspace }}
        run: python backend/build_ab_candidate.py --sha "$GITHUB_SHA" --output "$RUNNER_TEMP/ab-test-candidate"
      - name: Run unit tests
        working-directory: ${{ runner.temp }}/ab-test-candidate
        env:
          ENABLE_OPENAI_ANALYST: "false"
          ENABLE_SUPABASE_SYNC: "false"
          ENABLE_LOCAL_RETENTION: "false"
        run: python .github/ci/run_tests.py backend
      - name: Generated A/B retirement descriptor proof (Linux root, no production)
        working-directory: ${{ runner.temp }}/ab-test-candidate
        run: |
          sudo -n env PYTHONDONTWRITEBYTECODE=1 CI_SOURCE_SHA="$CI_SOURCE_SHA" GITHUB_SHA="$GITHUB_SHA" GITHUB_EVENT_NAME="$GITHUB_EVENT_NAME" CI_EVIDENCE_DIR="$CI_EVIDENCE_DIR" GITHUB_STEP_SUMMARY="$GITHUB_STEP_SUMMARY" AB_REPORT_PATH="$RUNNER_TEMP/ab-generated-report.json" "$(command -v python)" .github/ci/run_tests.py root
          sudo -n env PYTHONDONTWRITEBYTECODE=1 "$(command -v python)" backend/prototype/run_joint_qualification.py --report "$RUNNER_TEMP/ab-joint-report.json"
          sudo -n chmod 0644 "$RUNNER_TEMP/ab-joint-report.json"
          sudo -n chmod 0644 "$RUNNER_TEMP/ab-generated-report.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: generated-ab-report-${{ github.sha }}
          path: ${{ runner.temp }}/ab-generated-report.json
          if-no-files-found: warn
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ab-joint-report-${{ github.sha }}
          path: ${{ runner.temp }}/ab-joint-report.json
          if-no-files-found: warn
          retention-days: 7
      - name: One bounded known-structured-cardinality import (not full legacy volume)
        working-directory: ${{ runner.temp }}/ab-test-candidate
        env:
          AB_IMPORT_SOURCE_SHA: ${{ github.sha }}
        run: |
          sudo -n env PYTHONDONTWRITEBYTECODE=1 AB_SOURCE_REPOSITORY="$GITHUB_WORKSPACE" AB_IMPORT_SOURCE_SHA="$AB_IMPORT_SOURCE_SHA" "$(command -v python)" backend/prototype/run_legacy_import_qualification.py --report "$RUNNER_TEMP/ab-import-report.json"
          sudo -n chmod 0644 "$RUNNER_TEMP/ab-import-report.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ab-import-report-${{ github.sha }}
          path: ${{ runner.temp }}/ab-import-report.json
          if-no-files-found: warn
          retention-days: 7

      - name: Verify exported bytes after suites against exact Git objects
        working-directory: ${{ runner.temp }}/ab-test-candidate
        run: python backend/build_ab_candidate.py --repo "$GITHUB_WORKSPACE" --sha "$GITHUB_SHA" --output "$RUNNER_TEMP/ab-test-candidate" --verify
      - uses: actions/upload-artifact@v4
        with:
          name: ab-tested-manifest-${{ github.sha }}
          path: ${{ runner.temp }}/ab-test-candidate/AB_CANDIDATE_MANIFEST.json
          if-no-files-found: error
          retention-days: 7
      - name: Build reviewed Linux timestamp validator artifact
        working-directory: ${{ runner.temp }}/ab-test-candidate
        run: python backend/build_retention_native.py --output "$RUNNER_TEMP/retention-native/_retention_time.so"
      - uses: actions/upload-artifact@v4
        with:
          name: retention-native-${{ github.sha }}
          path: ${{ runner.temp }}/retention-native/
          if-no-files-found: error
          retention-days: 7

      - name: Publish test counts and exact candidate scope
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-test-${{ github.sha }}
          path: ${{ env.CI_EVIDENCE_DIR }}
          if-no-files-found: error
          retention-days: 7

  integrated-qualification:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      AB_SOURCE_REPOSITORY: ${{ github.workspace }}
      ENABLE_OPENAI_ANALYST: "false"
      ENABLE_SUPABASE_SYNC: "false"
      ENABLE_LOCAL_RETENTION: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install existing dependencies
        run: python -m pip install -r backend/requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: ab-tested-manifest-${{ github.sha }}
          path: ${{ runner.temp }}/ab-tested-manifest
      - name: Build exact tested export and compare manifest
        run: |
          python -c 'import time; print("AB_PROFILE_STARTED="+str(time.monotonic()))' >> "$GITHUB_ENV"
          mkdir -m 0700 "$RUNNER_TEMP/ab-integration-workspace"
          python backend/build_ab_candidate.py --sha "$GITHUB_SHA" --output "$RUNNER_TEMP/ab-integration-workspace/candidate"
          cmp "$RUNNER_TEMP/ab-tested-manifest/AB_CANDIDATE_MANIFEST.json" "$RUNNER_TEMP/ab-integration-workspace/candidate/AB_CANDIDATE_MANIFEST.json"
      - name: One bounded integrated ApplicationStore qualification (generated only)
        run: |
          sudo -n env PYTHONDONTWRITEBYTECODE=1 AB_PROFILE_STARTED="$AB_PROFILE_STARTED" AB_SOURCE_REPOSITORY="$GITHUB_WORKSPACE" "$(command -v python)" "$RUNNER_TEMP/ab-integration-workspace/candidate/backend/prototype/run_application_qualification.py" --sha "$GITHUB_SHA" --workspace "$RUNNER_TEMP/ab-integration-workspace" --report "$RUNNER_TEMP/ab-integration-workspace/integrated-report.json" --startup-mode fresh-b
      - name: Require the requested fresh-B qualification scope
        run: python -c 'import json,os; r=json.load(open(os.environ["RUNNER_TEMP"]+"/ab-integration-workspace/integrated-report.json")); assert r["startup_mode"]=="fresh-b" and r["archived_rows"]==4000 and r["legacy_retirement"]=="HELD"'
      - name: Verify candidate after integrated qualification
        if: always()
        run: |
          python backend/build_ab_candidate.py --repo "$GITHUB_WORKSPACE" --sha "$GITHUB_SHA" --output "$RUNNER_TEMP/ab-integration-workspace/candidate" --verify
          sudo -n chmod 0644 "$RUNNER_TEMP/ab-integration-workspace/integrated-report.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ab-integrated-report-${{ github.sha }}
          path: ${{ runner.temp }}/ab-integration-workspace/integrated-report.json
          if-no-files-found: error
          retention-days: 7

  quality:
    name: Source and workflow quality
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install narrow static checker
        run: python -m pip install ruff==0.11.13
      - name: Tracked syntax, shell and credential signatures
        run: python .github/ci/command.py source python .github/ci/check_source.py
      - name: Targeted invalid Python constructs (no broad style/type gate)
        run: python .github/ci/command.py static ruff check --select E9,F63,F7,F82 backend/app deploy/lightsail .github/ci
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.2"
          cache: false
      - name: Install pinned workflow validator
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
      - name: Validate workflows (shell syntax checked separately)
        run: python .github/ci/command.py workflows actionlint -shellcheck= -pyflakes=
      - name: Test fail-closed evidence controls
        run: python .github/ci/run_tests.py ci-controls
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-quality-${{ github.sha }}
          path: ${{ env.CI_EVIDENCE_DIR }}
          if-no-files-found: error
          retention-days: 7

  security:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned auditor
        run: python -m pip install pip-audit==2.9.0
      - name: Audit runtime dependencies (network/service failure blocks readiness)
        run: python .github/ci/command.py dependencies pip-audit -r backend/requirements.txt --progress-spinner off
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-security-${{ github.sha }}
          path: ${{ env.CI_EVIDENCE_DIR }}
          if-no-files-found: error
          retention-days: 7

  application:
    name: Application dashboard API and SSE contracts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install -r backend/requirements.txt
      - name: Export exact tracked candidate
        run: python backend/build_ab_candidate.py --sha "$GITHUB_SHA" --output "$RUNNER_TEMP/application-candidate"
      - name: Run application contracts once
        working-directory: ${{ runner.temp }}/application-candidate
        run: python .github/ci/run_tests.py application
      - name: Verify application candidate bytes
        run: python backend/build_ab_candidate.py --sha "$GITHUB_SHA" --output "$RUNNER_TEMP/application-candidate" --verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-application-${{ github.sha }}
          path: ${{ env.CI_EVIDENCE_DIR }}
          if-no-files-found: error
          retention-days: 7

  controls:
    name: Deployment and maintenance controls
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Export exact tracked candidate
        run: python backend/build_ab_candidate.py --sha "$GITHUB_SHA" --output "$RUNNER_TEMP/control-candidate"
      - name: Run offline deployment controls once
        working-directory: ${{ runner.temp }}/control-candidate
        run: python .github/ci/run_tests.py controls
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-controls-${{ github.sha }}
          path: ${{ env.CI_EVIDENCE_DIR }}
          if-no-files-found: error
          retention-days: 7

  readiness:
    name: PR readiness
    if: always()
    needs: [quality, security, application, controls, test, integrated-qualification]
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/ci-artifacts
      - name: Require successful gates and complete exact-candidate evidence
        env:
          CI_ARTIFACTS: ${{ runner.temp }}/ci-artifacts
          CI_JOB_RESULTS: >-
            {"quality":"${{ needs.quality.result }}","security":"${{ needs.security.result }}","application":"${{ needs.application.result }}","controls":"${{ needs.controls.result }}","test":"${{ needs.test.result }}","integrated":"${{ needs.integrated-qualification.result }}"}
        run: python .github/ci/readiness.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-readiness-${{ github.sha }}
          path: ${{ env.CI_EVIDENCE_DIR }}
          if-no-files-found: error
          retention-days: 7
