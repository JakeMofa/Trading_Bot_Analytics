name: Python tests

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      AB_SOURCE_REPOSITORY: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Compile Python sources
        working-directory: ${{ github.workspace }}
        run: python -m compileall -q backend/app deploy/lightsail
      - name: Install dependencies
        working-directory: ${{ github.workspace }}
        run: python -m pip install -r backend/requirements.txt
      - name: Export exact tracked candidate (no checkout/worktree/local data)
        working-directory: ${{ github.workspace }}
        run: python backend/build_ab_candidate.py --sha "$GITHUB_SHA" --output "$RUNNER_TEMP/ab-test-candidate"
      - name: Run unit tests
        working-directory: ${{ runner.temp }}/ab-test-candidate
        env:
          ENABLE_OPENAI_ANALYST: "false"
          ENABLE_SUPABASE_SYNC: "false"
          ENABLE_LOCAL_RETENTION: "false"
        run: python -m unittest discover -s backend/tests -v
      - name: Generated A/B retirement descriptor proof (Linux root, no production)
        working-directory: ${{ runner.temp }}/ab-test-candidate
        run: |
          sudo -n env PYTHONDONTWRITEBYTECODE=1 AB_REPORT_PATH="$RUNNER_TEMP/ab-generated-report.json" "$(command -v python)" -m unittest discover -s backend/tests -p test_raw_generations.py -v
          sudo -n env PYTHONDONTWRITEBYTECODE=1 "$(command -v python)" -m unittest discover -s backend/tests -p test_ab_application.py -v
          sudo -n env PYTHONDONTWRITEBYTECODE=1 "$(command -v python)" -m unittest discover -s backend/tests -p test_ab_runtime.py -v
          sudo -n env PYTHONDONTWRITEBYTECODE=1 "$(command -v python)" -m unittest discover -s backend/tests -p test_ab_cutover.py -v
          sudo -n chmod 0644 "$RUNNER_TEMP/ab-generated-report.json"
      - uses: actions/upload-artifact@v4
        with:
          name: generated-ab-report-${{ github.sha }}
          path: ${{ runner.temp }}/ab-generated-report.json
          if-no-files-found: error
          retention-days: 7
      - name: Run deployment and maintenance controls
        working-directory: ${{ runner.temp }}/ab-test-candidate
        run: python -m unittest discover -s deploy/lightsail -p 'test_*.py' -v

      - name: One bounded known-structured-cardinality import (not full legacy volume)
        working-directory: ${{ runner.temp }}/ab-test-candidate
        env:
          AB_IMPORT_SOURCE_SHA: ${{ github.sha }}
        run: python backend/prototype/run_legacy_import_qualification.py --report "$RUNNER_TEMP/ab-import-report.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ab-import-report-${{ github.sha }}
          path: ${{ runner.temp }}/ab-import-report.json
          if-no-files-found: warn
          retention-days: 7

      - name: Verify exported bytes after suites against exact Git objects
        working-directory: ${{ runner.temp }}/ab-test-candidate
        run: python backend/build_ab_candidate.py --repo "$GITHUB_WORKSPACE" --sha "$GITHUB_SHA" --output "$RUNNER_TEMP/ab-test-candidate" --verify
      - uses: actions/upload-artifact@v4
        with:
          name: ab-tested-manifest-${{ github.sha }}
          path: ${{ runner.temp }}/ab-test-candidate/AB_CANDIDATE_MANIFEST.json
          if-no-files-found: error
          retention-days: 7
      - name: Build reviewed Linux timestamp validator artifact
        working-directory: ${{ runner.temp }}/ab-test-candidate
        run: python backend/build_retention_native.py --output "$RUNNER_TEMP/retention-native/_retention_time.so"
      - uses: actions/upload-artifact@v4
        with:
          name: retention-native-${{ github.sha }}
          path: ${{ runner.temp }}/retention-native/
          if-no-files-found: error
          retention-days: 7

  integrated-qualification:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      AB_SOURCE_REPOSITORY: ${{ github.workspace }}
      ENABLE_OPENAI_ANALYST: "false"
      ENABLE_SUPABASE_SYNC: "false"
      ENABLE_LOCAL_RETENTION: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install existing dependencies
        run: python -m pip install -r backend/requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: ab-tested-manifest-${{ github.sha }}
          path: ${{ runner.temp }}/ab-tested-manifest
      - name: Build exact tested export and compare manifest
        run: |
          python -c 'import time; print("AB_PROFILE_STARTED="+str(time.monotonic()))' >> "$GITHUB_ENV"
          mkdir -m 0700 "$RUNNER_TEMP/ab-integration-workspace"
          python backend/build_ab_candidate.py --sha "$GITHUB_SHA" --output "$RUNNER_TEMP/ab-integration-workspace/candidate"
          cmp "$RUNNER_TEMP/ab-tested-manifest/AB_CANDIDATE_MANIFEST.json" "$RUNNER_TEMP/ab-integration-workspace/candidate/AB_CANDIDATE_MANIFEST.json"
      - name: One bounded integrated ApplicationStore qualification (generated only)
        run: |
          sudo -n env PYTHONDONTWRITEBYTECODE=1 AB_PROFILE_STARTED="$AB_PROFILE_STARTED" AB_SOURCE_REPOSITORY="$GITHUB_WORKSPACE" "$(command -v python)" "$RUNNER_TEMP/ab-integration-workspace/candidate/backend/prototype/run_application_qualification.py" --sha "$GITHUB_SHA" --workspace "$RUNNER_TEMP/ab-integration-workspace" --report "$RUNNER_TEMP/ab-integration-workspace/integrated-report.json"
      - name: Verify candidate after integrated qualification
        if: always()
        run: |
          python backend/build_ab_candidate.py --repo "$GITHUB_WORKSPACE" --sha "$GITHUB_SHA" --output "$RUNNER_TEMP/ab-integration-workspace/candidate" --verify
          sudo -n chmod 0644 "$RUNNER_TEMP/ab-integration-workspace/integrated-report.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ab-integrated-report-${{ github.sha }}
          path: ${{ runner.temp }}/ab-integration-workspace/integrated-report.json
          if-no-files-found: error
          retention-days: 7
