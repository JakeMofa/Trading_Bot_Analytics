name: Python tests

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Compile Python sources
        run: python -m compileall -q backend/app deploy/lightsail
      - name: Install dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Run unit tests
        env:
          MALLOC_ARENA_MAX: "2"
          PYTHONDONTWRITEBYTECODE: "1"
          ENABLE_OPENAI_ANALYST: "false"
          ENABLE_SUPABASE_SYNC: "false"
          ENABLE_LOCAL_RETENTION: "false"
        run: python -m unittest discover -s backend/tests -v

      - name: Generated storage Linux root checks for this split scope
        env:
          ENABLE_OPENAI_ANALYST: "false"
          ENABLE_SUPABASE_SYNC: "false"
          ENABLE_LOCAL_RETENTION: "false"
        run: |
          # Downstream suites are required as soon as their implementation enters the stack.
          for suite in test_raw_generations.py test_ab_application.py test_ab_runtime.py test_incremental_retirement.py test_ab_cutover.py test_archive_history.py; do
            if test -f "backend/tests/$suite"; then
              sudo -n env PYTHONDONTWRITEBYTECODE=1 ENABLE_OPENAI_ANALYST=false ENABLE_SUPABASE_SYNC=false ENABLE_LOCAL_RETENTION=false "$(command -v python)" -m unittest discover -s backend/tests -p "$suite" -v
            fi
          done

      - name: Run deployment controls
        run: python -m unittest discover -s deploy/lightsail -p 'test_*.py' -v
