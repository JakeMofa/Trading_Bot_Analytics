name: CI — Tradebot checks
on:
  push:
    branches: [main, preprod, "codex/**"]
  pull_request:
  merge_group:
permissions:
  contents: read
concurrency:
  group: source-ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
env:
  ENABLE_OPENAI_ANALYST: "false"
  ENABLE_SUPABASE_SYNC: "false"
  ENABLE_LOCAL_RETENTION: "false"
  PYTHONDONTWRITEBYTECODE: "1"
jobs:
  backend:
    name: Application and legacy SQLite compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r backend/requirements.txt
      - run: python -m unittest discover -s backend/tests -v
      - name: Record tested scope
        if: always()
        run: |
          python .github/ci/release_package.py summary backend
  controls:
    name: Release and deployment controls
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s .github/ci -p 'test_*.py' -v
      - run: python -m compileall -q backend/app .github/ci
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.24.2"
          cache: false
      - run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
      - run: actionlint -config-file .github/actionlint.yaml -shellcheck= -pyflakes=
      - name: Build and inspect registry carrier without publishing
        run: |
          python .github/ci/release_package.py fixture --output "$RUNNER_TEMP/package-fixture"
          docker build --network=none -t tradebot-release-test "$RUNNER_TEMP/package-fixture"
          cid=$(docker create tradebot-release-test /not-executed)
          trap 'docker rm "$cid" >/dev/null' EXIT
          docker cp "$cid:/release/manifest.json" "$RUNNER_TEMP/checked-manifest.json"
          cmp "$RUNNER_TEMP/package-fixture/manifest.json" "$RUNNER_TEMP/checked-manifest.json"
  dependencies:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install pip-audit==2.9.0
      - run: python -m pip_audit -r backend/requirements.txt --format json --output dependency-audit.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: dependency-audit-${{ github.sha }}
          path: dependency-audit.json
          if-no-files-found: error
          retention-days: 90
  postgres-foundation:
    name: PostgreSQL PP foundation
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s deploy/preprod/tests -v
      - name: Qualify isolated database and container recreation
        run: sudo env GITHUB_ACTIONS=true python3 deploy/preprod/foundation.py ci > postgres-foundation.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: postgres-foundation-${{ github.sha }}
          path: postgres-foundation.json
          if-no-files-found: error
          retention-days: 90
  readiness:
    name: PR readiness
    if: always()
    needs: [backend, controls, dependencies, postgres-foundation]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      RESULTS: ${{ toJSON(needs) }}
    steps:
      - name: Require every applicable check
        run: |
          python - <<'CHECK'
          import json, os
          results=json.loads(os.environ['RESULTS'])
          assert results and all(r['result']=='success' for r in results.values()), 'Required check failed, skipped or incomplete'
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as output:
              output.write('PR readiness: PASS. Source and isolated PostgreSQL foundation checks only; no application migration, cloud archive or production acceptance performed.\n\n[Authoritative roadmap](https://github.com/JakeMofa/Trading_Bot_Analytics/blob/main/docs/PLAN/INTELLIGENCE_REBUILD_PLAN.md)\n')
          CHECK
