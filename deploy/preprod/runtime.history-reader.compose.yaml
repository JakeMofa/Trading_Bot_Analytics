# Optional PP API overlay. Activation requires an exact release-bound host marker.
services:
  api:
    environment:
      TRADEBOT_PP_ARCHIVE_HISTORY: 'true'
    secrets:
      - history_reader_api_key
      - history_reader_email
      - history_reader_password
      - history_reader_uid
secrets:
  history_reader_api_key: {file: "${PP_RUNTIME_SECRET_DIR:?missing runtime directory}/history_reader_api_key"}
  history_reader_email: {file: "${PP_RUNTIME_SECRET_DIR:?missing runtime directory}/history_reader_email"}
  history_reader_password: {file: "${PP_RUNTIME_SECRET_DIR:?missing runtime directory}/history_reader_password"}
  history_reader_uid: {file: "${PP_RUNTIME_SECRET_DIR:?missing runtime directory}/history_reader_uid"}
