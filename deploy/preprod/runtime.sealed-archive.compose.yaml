# Opt-in PP archive worker. Mount a dedicated root-only lifecycle DSN before launch.
services:
  sealed_archive:
    image: ${PP_APP_IMAGE:?supply qualified local image ID}
    pull_policy: never
    profiles: [sealed_archive]
    command: [python, -m, postgres.pp_sealed_archive, --execute]
    user: '0:0'
    restart: 'no'
    mem_limit: 128m
    memswap_limit: 128m
    cpus: 0.25
    pids_limit: 64
    read_only: true
    tmpfs: ['/tmp:size=16m,mode=1777']
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPATH: /app/backend
      TRADEBOT_ENVIRONMENT: preprod
      TRADEBOT_DATA_MODE: pp_live
      TRADEBOT_ORIGIN_ID: pp-live-pp
      TRADEBOT_DATABASE_DSN_FILE: /run/secrets/lifecycle_dsn
      TRADEBOT_COLLECTOR_ENABLED: 'false'
      TRADEBOT_CLOUD_ENABLED: 'false'
      TRADEBOT_RETIREMENT_ENABLED: 'false'
      ENABLE_SUPABASE_SYNC: 'false'
      ENABLE_LOCAL_RETENTION: 'false'
      ENABLE_OPENAI_ANALYST: 'false'
      TRADEBOT_PP_SEALED_ARCHIVE: 'true'
      TRADEBOT_PP_STORAGE_API_KEY_FILE: /run/secrets/pp_storage_api_key
      TRADEBOT_PP_STORAGE_AUTH_EMAIL_FILE: /run/secrets/supabase_auth_email
      TRADEBOT_PP_STORAGE_AUTH_PASSWORD_FILE: /run/secrets/supabase_auth_password
      TRADEBOT_PP_STORAGE_AUTH_UID_FILE: /run/secrets/supabase_auth_uid
    secrets:
      - {source: sealed_local_dsn, target: /run/secrets/lifecycle_dsn}
      - pp_storage_api_key
      - supabase_auth_email
      - supabase_auth_password
      - supabase_auth_uid
    networks: [database, sealed_archive_egress]
    depends_on:
      postgres:
        condition: service_healthy
    logging:
      driver: json-file
      options: {max-size: 5m, max-file: '2'}
secrets:
  sealed_local_dsn:
    file: /etc/tradebot/cloud/pp_sealed_lifecycle_dsn
  pp_storage_api_key:
    file: /etc/tradebot/cloud/pp_storage_api_key
  supabase_auth_email:
    file: /etc/tradebot/cloud/supabase_auth_email
  supabase_auth_password:
    file: /etc/tradebot/cloud/supabase_auth_password
  supabase_auth_uid:
    file: /etc/tradebot/cloud/supabase_auth_uid
networks:
  sealed_archive_egress:
    driver: bridge
