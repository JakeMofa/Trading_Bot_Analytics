# Optional exact trial API reader. Requires independently qualified host attestation.
# No SQL, writer, lifecycle, Auth-admin or legacy reader credentials are introduced.
services:
  api:
    environment:
      TRADEBOT_ORIGIN_ID: pp-live-pp-trial-20261119-02
      TRADEBOT_PP_ARCHIVE_HISTORY: 'true'
    secrets:
      - trial_history_reader_api_key
      - trial_history_reader_email
      - trial_history_reader_password
      - trial_history_reader_uid
secrets:
  trial_history_reader_api_key: {file: "${PP_RUNTIME_SECRET_DIR:?missing runtime directory}/trial_20261119_02_history_reader_api_key"}
  trial_history_reader_email: {file: "${PP_RUNTIME_SECRET_DIR:?missing runtime directory}/trial_20261119_02_history_reader_email"}
  trial_history_reader_password: {file: "${PP_RUNTIME_SECRET_DIR:?missing runtime directory}/trial_20261119_02_history_reader_password"}
  trial_history_reader_uid: {file: "${PP_RUNTIME_SECRET_DIR:?missing runtime directory}/trial_20261119_02_history_reader_uid"}
